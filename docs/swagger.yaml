basePath: /
definitions:
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  auth.LoginResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/auth.User'
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  auth.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  auth.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  cart.AddItemRequest:
    properties:
      product_id:
        type: string
      quantity:
        type: integer
    type: object
  cart.CartItemResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      product_id:
        type: string
      quantity:
        type: integer
      updated_at:
        type: string
    type: object
  cart.CartResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/cart.CartItemResponse'
        type: array
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  cart.UpdateItemRequest:
    properties:
      quantity:
        type: integer
    type: object
  inventory.InventoryResponse:
    properties:
      product_id:
        type: string
      quantity:
        type: integer
      updated_at:
        type: string
    type: object
  inventory.UpdateInventoryRequest:
    properties:
      quantity:
        type: integer
    type: object
  notifications.NotificationResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_read:
        type: boolean
      message:
        type: string
    type: object
  orders.OrderItemResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      price:
        type: number
      product_id:
        type: string
      quantity:
        type: integer
    type: object
  orders.OrderResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/orders.OrderItemResponse'
        type: array
      status:
        type: string
      total_price:
        type: number
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  products.CreateProductRequest:
    properties:
      description:
        type: string
      name:
        type: string
      price:
        type: number
    type: object
  products.Product:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      price:
        type: number
      updated_at:
        type: string
    type: object
  products.UpdateProductRequest:
    properties:
      description:
        type: string
      name:
        type: string
      price:
        type: number
    type: object
  shared.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  shared.PaginatedResponse:
    properties:
      data: {}
      limit:
        type: integer
      page:
        type: integer
      total_count:
        type: integer
      total_pages:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@ecommerce.local
    name: API Support
  description: A complete E-Commerce REST API built in Go following layered architecture
    (Handler → Service → Repository)
  title: E-Commerce REST API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password to receive a session token.
        The token must be included in subsequent requests via X-Session-Token header.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful, returns session token
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      description: Invalidate the current session token. After logout, the token can
        no longer be used for authentication.
      parameters:
      - description: Session token
        in: header
        name: X-Session-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Logout successful
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Missing or invalid session token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - SessionToken: []
      summary: Logout
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new customer account. Email must be valid format, password
        must be at least 8 characters, and name is required.
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User successfully registered
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "400":
          description: Invalid request body or validation error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /cart:
    delete:
      description: Remove all items from the current user's cart. This action cannot
        be undone.
      parameters:
      - description: Session token
        in: header
        name: X-Session-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Cart cleared successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Missing or invalid session token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - SessionToken: []
      summary: Clear cart
      tags:
      - cart
    get:
      description: Get the current authenticated user's shopping cart with all items.
        If cart is empty, returns empty items array.
      parameters:
      - description: Session token
        in: header
        name: X-Session-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Cart details with items
          schema:
            $ref: '#/definitions/cart.CartResponse'
        "401":
          description: Missing or invalid session token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - SessionToken: []
      summary: Get cart
      tags:
      - cart
  /cart/items:
    post:
      consumes:
      - application/json
      description: Add a product to the cart. If the product already exists in the
        cart, the quantity will be updated. Quantity must be positive and inventory
        must be sufficient.
      parameters:
      - description: Session token
        in: header
        name: X-Session-Token
        required: true
        type: string
      - description: Item details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cart.AddItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Item added to cart successfully
          schema:
            $ref: '#/definitions/cart.CartItemResponse'
        "400":
          description: Invalid request body, validation error, insufficient inventory,
            or invalid quantity
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Missing or invalid session token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - SessionToken: []
      summary: Add item to cart
      tags:
      - cart
  /cart/items/{item_id}:
    delete:
      description: Remove an item from the cart. Users can only remove items from
        their own cart.
      parameters:
      - description: Session token
        in: header
        name: X-Session-Token
        required: true
        type: string
      - description: Cart item ID
        format: uuid
        in: path
        name: item_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Item removed successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid item ID format
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Missing or invalid session token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Access denied (not your cart item)
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "404":
          description: Cart item not found
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - SessionToken: []
      summary: Remove cart item
      tags:
      - cart
    put:
      consumes:
      - application/json
      description: Update the quantity of a cart item. Quantity must be positive and
        inventory must be sufficient. Users can only update their own cart items.
      parameters:
      - description: Session token
        in: header
        name: X-Session-Token
        required: true
        type: string
      - description: Cart item ID
        format: uuid
        in: path
        name: item_id
        required: true
        type: string
      - description: Update details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cart.UpdateItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Cart item updated successfully
          schema:
            $ref: '#/definitions/cart.CartItemResponse'
        "400":
          description: Invalid request body, validation error, insufficient inventory,
            or invalid quantity
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Missing or invalid session token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Access denied (not your cart item)
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "404":
          description: Cart item not found
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - SessionToken: []
      summary: Update cart item
      tags:
      - cart
  /health:
    get:
      description: Check if the API server is running and healthy
      produces:
      - application/json
      responses:
        "200":
          description: Server is healthy
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - utility
  /inventory/{product_id}:
    get:
      description: Get inventory quantity for a product. Public endpoint, no authentication
        required.
      parameters:
      - description: Product ID
        format: uuid
        in: path
        name: product_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Inventory details
          schema:
            $ref: '#/definitions/inventory.InventoryResponse'
        "400":
          description: Invalid product ID format
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "404":
          description: Inventory not found for product
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      summary: Get inventory
      tags:
      - inventory
    put:
      consumes:
      - application/json
      description: Update inventory quantity for a product. Requires admin role. Quantity
        must be non-negative.
      parameters:
      - description: Session token
        in: header
        name: X-Session-Token
        required: true
        type: string
      - description: Product ID
        format: uuid
        in: path
        name: product_id
        required: true
        type: string
      - description: Inventory update details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/inventory.UpdateInventoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Inventory updated successfully
          schema:
            $ref: '#/definitions/inventory.InventoryResponse'
        "400":
          description: Invalid request body, validation error, or negative quantity
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Missing or invalid session token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Insufficient permissions (admin required)
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "404":
          description: Inventory not found for product
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - SessionToken: []
      summary: Update inventory
      tags:
      - inventory
  /notifications:
    get:
      description: Get all notifications for the current authenticated user. Notifications
        are ordered by creation date (newest first).
      parameters:
      - description: Session token
        in: header
        name: X-Session-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of user notifications
          schema:
            items:
              $ref: '#/definitions/notifications.NotificationResponse'
            type: array
        "401":
          description: Missing or invalid session token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - SessionToken: []
      summary: List notifications
      tags:
      - notifications
  /notifications/{id}/read:
    put:
      description: Mark a notification as read. Users can only mark their own notifications
        as read.
      parameters:
      - description: Session token
        in: header
        name: X-Session-Token
        required: true
        type: string
      - description: Notification ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Notification marked as read
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid notification ID format
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Missing or invalid session token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Access denied (not your notification)
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "404":
          description: Notification not found
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - SessionToken: []
      summary: Mark notification as read
      tags:
      - notifications
  /orders:
    get:
      description: Get a paginated list of orders. Customers see only their own orders,
        admins see all orders.
      parameters:
      - description: Session token
        in: header
        name: X-Session-Token
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of orders
          schema:
            allOf:
            - $ref: '#/definitions/shared.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/orders.OrderResponse'
                  type: array
              type: object
        "401":
          description: Missing or invalid session token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - SessionToken: []
      summary: List orders
      tags:
      - orders
    post:
      description: Create an order from the current cart. Cart must not be empty and
        inventory must be sufficient. After successful order creation, the cart is
        cleared and a notification is sent.
      parameters:
      - description: Session token
        in: header
        name: X-Session-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Order created successfully
          schema:
            $ref: '#/definitions/orders.OrderResponse'
        "400":
          description: Cart is empty or insufficient inventory
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Missing or invalid session token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - SessionToken: []
      summary: Create order
      tags:
      - orders
  /orders/{id}:
    get:
      description: Get order details by ID including all order items. Customers can
        only view their own orders, admins can view any order.
      parameters:
      - description: Session token
        in: header
        name: X-Session-Token
        required: true
        type: string
      - description: Order ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Order details with items
          schema:
            $ref: '#/definitions/orders.OrderResponse'
        "400":
          description: Invalid order ID format
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Missing or invalid session token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Access denied (not your order)
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - SessionToken: []
      summary: Get order
      tags:
      - orders
  /products:
    get:
      description: Get a paginated list of all products. Public endpoint, no authentication
        required.
      parameters:
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of products
          schema:
            allOf:
            - $ref: '#/definitions/shared.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/products.Product'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      summary: List products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: Create a new product. Requires admin role. Product name and price
        are required. Price must be non-negative.
      parameters:
      - description: Session token
        in: header
        name: X-Session-Token
        required: true
        type: string
      - description: Product details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/products.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Product created successfully
          schema:
            $ref: '#/definitions/products.Product'
        "400":
          description: Invalid request body or validation error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Missing or invalid session token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Insufficient permissions (admin required)
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - SessionToken: []
      summary: Create product
      tags:
      - products
  /products/{id}:
    delete:
      description: Delete a product. Requires admin role. This action cannot be undone.
      parameters:
      - description: Session token
        in: header
        name: X-Session-Token
        required: true
        type: string
      - description: Product ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Product deleted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid product ID format
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Missing or invalid session token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Insufficient permissions (admin required)
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - SessionToken: []
      summary: Delete product
      tags:
      - products
    get:
      description: Get a product by ID. Public endpoint, no authentication required.
      parameters:
      - description: Product ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Product details
          schema:
            $ref: '#/definitions/products.Product'
        "400":
          description: Invalid product ID format
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      summary: Get product
      tags:
      - products
    put:
      consumes:
      - application/json
      description: Update a product. Requires admin role. Only provided fields will
        be updated.
      parameters:
      - description: Session token
        in: header
        name: X-Session-Token
        required: true
        type: string
      - description: Product ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Product update details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/products.UpdateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Product updated successfully
          schema:
            $ref: '#/definitions/products.Product'
        "400":
          description: Invalid request body or validation error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Missing or invalid session token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Insufficient permissions (admin required)
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - SessionToken: []
      summary: Update product
      tags:
      - products
schemes:
- http
securityDefinitions:
  SessionToken:
    description: Session token for authentication. Obtain by logging in via /auth/login
      endpoint.
